name: Release Build

# 发版流程：git tag v1.0.0 && git push origin v1.0.0
# → 自动构建双平台并创建正式 Release（Release 页直接可见、附件齐全）。
# 平时的普通提交不触发任何构建；workflow_dispatch 仅用于日常验证，
# 产物只挂在该 run 的 Artifacts，不影响 Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 通用二进制：同时支持 Apple Silicon 与 Intel
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          # Windows 64 位
          - os: windows-latest
            rust_targets: ""
            args: ""
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to draft release
        # 只有 tag push 才走 tauri-action（构建 + 创建 Release）
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: vx-m-open v__VERSION__
          releaseBody: "请按平台下载安装包。macOS 为通用二进制（Apple Silicon / Intel 均可用），Windows 为 64 位安装包。"
          releaseDraft: false
          prerelease: false

      # 手动触发：只构建不发布，产物走下面的 Artifacts
      - name: Build (manual, no release)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm tauri build ${{ matrix.args }}

      # 仅手动触发时把安装包挂到本次 run 的 Artifacts，方便下载验证
      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vx-m-open-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vx-m-open-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
